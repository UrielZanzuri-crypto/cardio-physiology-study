<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול: פיזיולוגיה קרדיווסקולרית – שאלות לבוחן</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d2430;--muted:#5c6673;--line:#e2ddd3;--accent:#9b2226;--accent2:#1f5f8b;--ok:#2a9d8f;--bad:#c1121f;--en:#1f5f8b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,"Noto Sans Hebrew",sans-serif;font-size:16px;line-height:1.55}
.top{position:sticky;top:0;z-index:20;background:#fffdf9;border-bottom:1px solid var(--line);padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top h1{font-size:19px;margin:0;flex:1 1 auto}
.top h1 small{font-weight:400;color:var(--muted);font-size:13px}
.top a{color:var(--accent2);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;background:#fff;font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px;background:#fff}
main{max-width:900px;margin:0 auto;padding:16px}
.score{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px}
.score b{font-size:18px}
.bar{flex:1 1 200px;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.q.hidden{display:none}
.q .meta{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.q .meta span{background:#f1ede4;border-radius:999px;padding:1px 8px}
.q .meta span.src{background:#e6f4f1;color:#1b7a44;font-weight:600}
.q .meta span.src.extra{background:#eef2fb;color:#1f5f8b}
.q h3{margin:0 0 10px;font-size:16.5px}
.q img{max-width:100%;max-height:360px;display:block;margin:6px auto 10px;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;background:#fff}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;background:#fcfbf8;font-size:15px}
.opt:hover{border-color:var(--accent2)}
.q.done .opt{cursor:default}
.opt.correct{background:#e6f4f1;border-color:var(--ok);font-weight:600}
.opt.wrong{background:#fdecec;border-color:var(--bad)}
.exp{display:none;margin-top:10px;font-size:14.5px;background:#fff8ec;border:1px solid #f0d9b4;border-radius:8px;padding:8px 12px}
.q.done .exp{display:block}
.exp::before{content:"הסבר: ";font-weight:700;color:#9a5b00}
.en{direction:ltr;unicode-bidi:isolate;color:var(--en);font-weight:600;font-style:normal}
.en.plain{font-weight:400;color:inherit}
.final{background:#fff;border:2px solid var(--accent);border-radius:12px;padding:14px 18px;margin:16px 0;display:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:16px}
#lb img{max-width:96vw;max-height:90vh;border-radius:6px;background:#fff}
</style>
</head>

<script>
const TOPICS={elec:'חשמל: קוצבים ו-AP',ecg:'אק"ג',cycle:'מחזור הלב וקולות',mech:'Preload/Afterload/Inotropy',pv:'PV loop ופרנק-סטרלינג',vess:'כלי דם והמודינמיקה',cap:'נימים וכוחות סטרלינג',ans:'בקרה עצבית ורפלקסים',sv:'בקרה על HR ו-SV'};
// s: 'course' = מהבחנים של הקורס, 'extra' = שאלות נוספות שנכתבו לפי רשימות המושגים
const Q=[
/* ---------- שאלות מהבחנים (בוחן בוקר 04.12, בוחן 1, צילומי מסך) ---------- */
{s:'course',src:'בוחן בוקר 04.12',t:'elec',q:'מסלול ההולכה החשמלית בלב מאפשר תזמון ופיזור נכון של פוטנציאל הפעולה לאורך הלב. הקיפו את הסדר הנכון של מערכת ההולכה של הלב:',o:['<i class="en">SA node → AV node → Bundle of His → Purkinje fibers</i>','<i class="en">AV node → Bundle of His → SA node → Purkinje fibers</i>','<i class="en">Bundle of His → AV node → SA node → Purkinje fibers</i>','<i class="en">SA node → Bundle of His → AV node → Purkinje fibers</i>'],a:0,e:'הגירוי נוצר ב-SA node (הקוצב הראשי), מתפשט בעליות, מגיע ל-AV node (השהיה), עובר בצרור היס, בהסתעפויות ובסיבי פורקיניה אל שריר החדרים.'},
{s:'course',src:'בוחן 1',t:'elec',q:'מסלול ההולכה החשמלית בלב מאפשר תזמון ופיזור נכון של פוטנציאל הפעולה לאורך הלב. מה מהבאים נכון?',o:['ה-<i class="en">SA node</i> הינו הקוצב המשני של הלב, ההולכה בו מהירה והוא מאפשר כיווץ סימולטני של העליות והחדרים','סיבי פורקיניה הם צרורות של תאים עם הולכה איטית המוליכים את המסר החשמלי מה-<i class="en">SA node</i> אל ה-<i class="en">AV node</i>','הצרור על שם היס הוא צרור של תאים עם הולכה מהירה המעביר את המסר החשמלי מה-<i class="en">SA node</i> אל העליות','ה-<i class="en">AV node</i> הוא הקוצב המשני של הלב, ההולכה בו איטית והוא מאפשר השהייה בין כיווץ העליות לכיווץ החדרים'],a:3,e:'ה-AV node הוא המעבר היחיד בין העליות לחדרים; ההולכה בו איטית (השהיה של ~0.1 שנייה = מקטע PR) כדי שהעליות יסיימו להתכווץ לפני החדרים, והוא קוצב משני (~50/דקה). ה-SA node הוא הקוצב הראשי; פורקיניה מוליכים מהר בחדרים; היס מעביר מה-AVN לחדרים.'},
{s:'course',src:'בוחן 1',t:'elec',img:'img/quiz-ap-fast.jpg',q:'לפניך תרשים של פוטנציאל פעולה שנמדד מאיזור מסוים משריר לב בריא (A – Fast Response). מוליכות של איזה יון דומיננטית במהלך שלב 0 (דה-פולריזציה) באיור?',o:['נתרן','אשלגן','מגנזיום','סידן'],a:0,e:'בתאים מהירים (מיוציטים, פורקיניה) שלב 0 נובע מפתיחת תעלות Na⁺ מהירות תלויות מתח – עלייה תלולה עם overshoot. הסידן אחראי ל-plateau (שלב 2), האשלגן לרה-פולריזציה.'},
{s:'course',src:'בוחן 1',t:'elec',img:'img/quiz-ap-slow.jpg',q:'לפניך תרשים של פוטנציאל פעולה שנמדד מאיזור מסוים משריר לב בריא (B – Slow Response). מוליכות של איזה יון דומיננטית במהלך שלב 0 (דה-פולריזציה) באיור?',o:['מגנזיום','סידן','אשלגן','נתרן'],a:1,e:'בתאי קוצב (SAN, AVN) אין תעלות Na⁺ מהירות פעילות; הדה-פולריזציה האיטית של שלב 0 נובעת מכניסת Ca²⁺ דרך תעלות L. שלב 4 (פוטנציאל הקוצב) מונע ע"י הזרם ה"מצחיק" I<sub>f</sub>.'},
{s:'course',src:'בוחן בוקר 04.12',t:'cycle',img:'img/quiz-wiggers.jpg',q:'לפניך עקומת Wiggers המתארת את השינויים המתרחשים בחדר השמאלי של לב תקין בעת ה-Cardiac Cycle. האותיות מציינות נקודות ספציפיות במהלך הסיסטולה והדיאסטולה. בהתאם לאיור, איזו אות מסמנת את הפתיחה של המסתם המיטרלי (<i class="en">Mitral Valve</i>)?',o:['C','A','B','D'],a:3,e:'המיטרלי נפתח כשלחץ החדר יורד מתחת ללחץ העלייה, בסוף ההרפיה האיזו-וולומטרית – הנקודה D (לחץ נמוך, הנפח מתחיל לעלות). A = סגירת המיטרלי, B = פתיחת האאורטלי, C = סגירת האאורטלי.'},
{s:'course',src:'בוחן 1',t:'cycle',img:'img/quiz-wiggers.jpg',q:'לפניך עקומת Wiggers. איזו אות מסמנת את הפתיחה של המסתם האאורטלי (<i class="en">Aortic Valve</i>)?',o:['B','A','C','D'],a:0,e:'האאורטלי נפתח כשלחץ החדר (כחול) עובר את הלחץ הדיאסטולי באאורטה (~80 mmHg) – סוף הכיווץ האיזו-וולומטרי, נקודה B. מכאן מתחילה הפליטה והנפח (אדום) יורד.'},
{s:'course',src:'בוחן 1',t:'cycle',img:'img/quiz-wiggers.jpg',q:'לפניך עקומת Wiggers. המספרים מציינים את השלבים השונים. איזה מספר מסמן את התקופה בה יוצא דם החוצה מחדר שמאל (<i class="en">Systolic Ejection</i>)?',o:['2','4','3','1'],a:0,e:'שלב 2 הוא הפליטה: בין פתיחת האאורטלי (B) לסגירתו (C), נפח החדר יורד. 1 = כיווץ איזו-וולומטרי, 3 = הרפיה איזו-וולומטרית, 4 = מילוי מהיר.'},
{s:'course',src:'בוחן בוקר 04.12',t:'mech',q:'המשפטים הבאים מתייחסים למרכיבים של המשוואה CO = SV × HR, מתוך הבנת עקומת Frank-Starling ועקומת נפח-לחץ בחדר (PV loop). סמנו את המשפט <b>הלא נכון</b>:',o:['הגדלת התנגודת הפריפרית, כלומר העלאת <i class="en">afterload</i> – מגדילה את נפח הפעימה','על פי עקומת Frank-Starling הגדלת ה-<i class="en">preload</i> תגדיל את הלחץ המקסימלי שהלב יצור בעת הסיסטולה','הפעלת המערכת הסימפתטית על הלב תגדיל את הכיווציות ותאיץ את קצב הלב, לכן תעלה תפוקת הלב','עלייה בקצב הלב מ-60 ל-120 פעימות לדקה – אומנם מקטינה את נפח הפעימה אך מגדילה את תפוקת הלב'],a:0,e:'עליית afterload מקטינה את נפח הפעימה (הפליטה נגמרת מוקדם, ESV עולה). שאר המשפטים נכונים: preload גבוה → לחץ ו-SV גבוהים (פרנק-סטרלינג); סימפתטי מעלה גם כיווציות וגם קצב → CO עולה; קצב 120 מקצר את הדיאסטולה ו-SV יורד מעט, אבל CO עולה.'},
{s:'course',src:'בוחן 1',t:'mech',q:'המשפטים הבאים מתייחסים למרכיבים של המשוואה CO = SV × HR, מתוך הבנת עקומת Frank-Starling ועקומת נפח-לחץ בחדר (PV loop). <b>מה מהבאים נכון?</b>',o:['עלייה בקצב הלב (HR) מ-60 ל-120 פעימות לדקה – אומנם מקטינה את נפח הפעימה אך מגדילה את תפוקת הלב','על פי עקומת Frank-Starling הגדלת ה-<i class="en">preload</i> תגדיל את הלחץ המקסימלי שהלב יצור בעת הסיסטולה – כך מתאפשר הקטנה של נפח הפעימה','הגדלת התנגודת הפריפרית, כלומר העלאת <i class="en">afterload</i> – מגדילה את נפח הפעימה','הפעלת המערכת הסימפתטית על הלב תגדיל את הכיווציות אך תאט את קצב הלב, לכן לא תשנה את תפוקת הלב'],a:0,e:'הכפלת הקצב מקצרת את זמן המילוי (הדיאסטולה מתקצרת יותר מהסיסטולה) → SV קטן מעט, אבל CO = SV × HR עולה. הגדלת preload מגדילה SV ולא מקטינה; afterload מקטין SV; הסימפתטי מאיץ (ולא מאט) את הקצב.'},
{s:'course',src:'בוחן בוקר 04.12',t:'pv',img:'img/pv-loop-abcdef.jpg',q:'באיור הבא מתוארת עקומת נפח-לחץ (PV loop) של חדר שמאל. באיזו נקודה מודגמת פתיחת המסתם האאורטלי ותחילת ה-<i class="en">Systolic Ejection</i>?',o:['C','F','E','B','D','A'],a:4,e:'C→D הוא הכיווץ האיזו-וולומטרי (קו אנכי – הנפח קבוע, הלחץ עולה). בנקודה D לחץ החדר משתווה ללחץ הדיאסטולי באאורטה, המסתם נפתח ומתחילה הפליטה D→E→F. A = פתיחת המיטרלי, C = סגירתו, E = שיא הלחץ (afterload), F = סגירת האאורטלי.'},
{s:'course',src:'בוחן 1',t:'pv',img:'img/pv-loop-abcdef.jpg',q:'באיור הבא מתוארת עקומת נפח-לחץ (PV loop) של חדר שמאל. נפח הפעימה (<i class="en">Stroke Volume – SV</i>) נמדד בין הנקודות:',o:['C–D','A–B','F–A','D–F','E–D'],a:3,e:'SV = EDV − ESV = רוחב הלולאה. שלב הפליטה D→F מתחיל ב-EDV (~150) ונגמר ב-ESV (~70): SV ≈ 80 מ"ל. גם C–A מייצג את אותו הפרש נפחים. C–D ו-F–A הם שלבים איזו-וולומטריים (הנפח לא משתנה).'},
{s:'course',src:'בוחן 1',t:'pv',img:'img/pv-loop-abcdef.jpg',q:'באיור הבא מתוארת עקומת נפח-לחץ (PV loop) של חדר שמאל. על איזו נקודה תשפיע הגדלת הנפח הסוף-דיאסטולי?',o:['D','A','C','F','E','B'],a:2,e:'C היא סוף המילוי = סגירת המיטרלי = EDV = preload. הגדלת EDV מזיזה את C ימינה על ה-EDPVR, הלולאה מתרחבת ימינה, SV גדל. A היא ESV (כמעט לא משתנה בשינוי preload).'},
{s:'course',src:'בוחן 1',t:'cap',q:'תהליך הפילטרציה בנימים תלוי במאזן הכוחות ההידרוסטטיים והאוסמוטיים בתוך ומחוץ לנימת הדם. מה מהבאים נכון?',o:['כל הנוזל שיוצא בפילטרציה מהנימים בצד העורקי חוזר אליהם בספיגה מחדש בצד הורידי','ירידה בלחץ הדם בורידים תגרום לירידה בלחץ ההידרוסטטי בנימים ולכן עלולה לגרום לבצקת','ברקמה תקינה, הלחץ ההידרוסטטי במרכיב הבין-תאי הוא גבוה מאוד ויש לו השפעה ניכרת על תהליך הפילטרציה','ירידה בכמות האלבומין בגוף תגרום לירידת הלחץ האוסמוטי בנימים ולכן עלולה לגרום לבצקת'],a:3,e:'אלבומין הוא החלבון העיקרי שיוצר את הלחץ האונקוטי (π<sub>c</sub> ≈ 25 mmHg) שמושך נוזל חזרה לנימה; ירידה בו → פחות ספיגה → בצקת. רק ~90% מהנוזל המסונן נספג חזרה (10% דרך הלימפה); ירידה בלחץ הוורידי מקטינה P<sub>c</sub> ומפחיתה בצקת; P<sub>i</sub> ברקמה תקינה קטן מאוד.'},
{s:'course',src:'בוחן בוקר 04.12',t:'cap',q:'תהליך הפילטרציה בנימים תלוי במאזן הכוחות ההידרוסטטיים והאוסמוטיים בתוך ומחוץ לנימת הדם. סמנו את המשפט <b>הלא נכון</b>:',o:['ברקמה תקינה, הלחץ ההידרוסטטי במרכיב הבין-תאי הוא קטן מאוד ואין לו השפעה ניכרת על תהליך הפילטרציה','ירידה בכמות האלבומין בגוף תגרום לירידת הלחץ האוסמוטי בנימים ולכן עלולה לגרום לבצקת','כל הנוזל שיוצא בפילטרציה מהצד העורקי חוזר אליהם בספיגה מחדש בצד הורידי','עליה בלחץ הדם בורידים תגרום לעליה בלחץ ההידרוסטטי בנימים ולכן עלולה לגרום לבצקת'],a:2,e:'הפילטרציה בצד העורקי עולה על הספיגה בצד הוורידי; העודף (~10%, 2–4 ליטר ביום) חוזר למחזור הדם דרך מערכת הלימפה. שאר המשפטים נכונים לפי היפותזת סטרלינג.'},
{s:'course',src:'בוחן 1',t:'cap',q:'בהקשר לבקרה על תפקוד כלי הדם, הפרשת <i class="en">NO (Nitric oxide)</i> מתאי האנדותל תגרום באופן ישיר ל:',o:['הרחבה של כלי הדם','כיווץ של כלי הדם','ירידה בקצב הלב','עלייה בקצב הלב'],a:0,e:'NO מהאנדותל מפעיל גואנילט ציקלאז בשריר החלק → cGMP → הרפיה → vasodilation. גם PGI₂ מרחיב; אנדותלין מכווץ. NO לא משפיע ישירות על קצב הלב.'},
/* ---------- שאלות נוספות – חשמל ---------- */
{s:'extra',t:'elec',q:'מדוע ה-<i class="en">SA node</i> הוא הקוצב הדומיננטי של הלב?',o:['כי הוא היחיד שיש לו אוטומטיות','כי קצב הדה-פולריזציה הספונטנית שלו הוא המהיר ביותר, ולכן הוא מגיע לסף ראשון ומאפס את שאר הקוצבים','כי הוא מקבל את העצבוב הסימפתטי החזק ביותר','כי הוא ממוקם במחיצה בין העליות לחדרים'],a:1,e:'גם ל-AVN (~50/דקה) ולמערכת His–Purkinje (~30–40) יש אוטומטיות, אבל ה-SAN (~70) מגיע לסף ראשון בכל מחזור, והגירוי שלו מדפלרז את שאר התאים לפני שהם מספיקים לירות לבד (overdrive suppression).'},
{s:'extra',t:'elec',q:'מהו הגורם האנטומי שמבטיח שהגירוי החשמלי מהעליות יעבור לחדרים אך ורק דרך ה-<i class="en">AV node</i>?',o:['ה-<i class="en">gap junctions</i> בין תאי העליות והחדרים','טבעת רקמת חיבור צפופה המפרידה חשמלית בין העליות לחדרים','הפריקרדיום','המחיצה הבין-חדרית'],a:1,e:'העליות מופרדות מהחדרים ע"י רקמת חיבור פיברוטית שאינה מוליכה חשמל. המעבר היחיד הוא ה-AVN – כך נשמרת השליטה על תזמון כיווץ החדרים.'},
{s:'extra',t:'elec',q:'מהי המשמעות התפקודית של ההשהיה ב-<i class="en">AV node</i>?',o:['היא מאפשרת לחדרים להתכווץ לפני העליות','היא מאפשרת לעליות לסיים את כיווצן ולהשלים את מילוי החדרים לפני שהחדרים מתכווצים','היא מונעת מהגירוי להגיע לחדרים כלל','היא מאריכה את גל ה-T'],a:1,e:'ההשהיה (~0.1 שנייה, מקטע PR) נובעת מההולכה האיטית ב-AVN (תאים איטיים, מעט gap junctions). בלעדיה העליות והחדרים היו מתכווצים יחד והחדרים היו מאבדים את ה-atrial kick.'},
{s:'extra',t:'elec',q:'מהו ההבדל המהותי בין פוטנציאל הפעולה של שריר הלב לזה של שריר השלד, וכיצד הוא מסביר את האופי הפעימתי של הלב?',o:['ה-AP של הלב קצר יותר ולכן הלב מתכווץ מהר יותר','ה-AP של הלב ארוך מאוד וחופף לכיווץ, ולכן התקופה הרפרקטורית מונעת סכימה של כיווצים (טטנוס)','ה-AP של הלב אינו תלוי בנתרן','ל-AP של הלב אין רה-פולריזציה'],a:1,e:'בשריר שלד ה-AP (~2 ms) נגמר הרבה לפני הכיווץ ואפשר לסכם גירויים. בלב ה-AP (~250–300 ms) נמשך כמעט כל הכיווץ, והתקופה הרפרקטורית המוחלטת מונעת גירוי חוזר – הלב חייב להירפות ולהתמלא בין פעימות.'},
{s:'extra',t:'elec',q:'איזה שילוב של זרמים אחראי ל-plateau (שלב 2) של פוטנציאל הפעולה בתא לב מהיר?',o:['כניסת Na⁺ מול יציאת Cl⁻','כניסת Ca²⁺ דרך תעלות L מול יציאת K⁺','יציאת Ca²⁺ מול כניסת K⁺','כניסת Na⁺ דרך I<sub>f</sub> מול כניסת Ca²⁺'],a:1,e:'ב-plateau הממברנה "תקועה" ליד 0 mV כי זרם הסידן הנכנס מאוזן ע"י זרם האשלגן היוצא. כשתעלות הסידן נכנסות לאינאקטיבציה, I<sub>K</sub> גובר ומגיעה רה-פולריזציה (שלב 3). הסידן שנכנס הוא הטריגר לשחרור סידן מה-SR.'},
{s:'extra',t:'elec',q:'מה קובע את פוטנציאל המנוחה (שלב 4) בתא שריר לב מהיר?',o:['מוליכות גבוהה ל-Na⁺','מוליכות גבוהה ל-K⁺ (תעלות I<sub>K1</sub>)','מוליכות גבוהה ל-Ca²⁺','משאבת הסידן'],a:1,e:'כמו בעצב: במנוחה הממברנה חדירה בעיקר לאשלגן, ולכן הפוטנציאל (‎−90 mV) קרוב לפוטנציאל שיווי המשקל של K⁺. עם הגירוי, הפוטנציאל נקבע ע"י זרם הנתרן.'},
{s:'extra',t:'elec',q:'מהו "הזרם המצחיק" (<i class="en">Funny current, I<sub>f</sub></i>) ומה תפקידו?',o:['זרם אשלגן יוצא שמופעל בדה-פולריזציה ואחראי לרה-פולריזציה','זרם נתרן נכנס שמופעל דווקא בהיפרפולריזציה ואחראי לדה-פולריזציה האיטית של שלב 4 בתאי הקוצב','זרם סידן אחראי ל-plateau','זרם כלוריד שמייצב את פוטנציאל המנוחה'],a:1,e:'התעלות (HCN) נפתחות כשהממברנה מגיעה לכ-‎−55 mV בסוף הרה-פולריזציה – "מצחיק" כי כל תעלה אחרת נפתחת בדה-פולריזציה. I<sub>f</sub> מעלה בהדרגה את הפוטנציאל עד הסף, ושיפוע העלייה הזו קובע את קצב הלב.'},
{s:'extra',t:'elec',q:'בתא קוצב ב-<i class="en">SA node</i>, מה קורה כש-I<sub>f</sub> &gt; I<sub>K</sub>?',o:['רה-פולריזציה','הממברנה נשארת בפוטנציאל מנוחה יציב','דה-פולריזציה איטית (פוטנציאל הקוצב) עד הסף, ואז מתחיל I<sub>Ca</sub>','היפרפולריזציה'],a:2,e:'מההרצאה: I<sub>K</sub> &gt; I<sub>f</sub> → רה-פולריזציה; I<sub>K</sub> = I<sub>f</sub> → ‎−65 mV (נקודת האיזון, "מנוחה" רגעית); I<sub>f</sub> &gt; I<sub>K</sub> → דה-פולריזציה איטית, ובסף נפתחות תעלות סידן ונוצר ה-upstroke.'},
{s:'extra',t:'elec',q:'מה ההבדל בין התקופה הרפרקטורית המוחלטת (ERP) ליחסית (RRP)?',o:['ב-ERP כל גירוי יוצר AP; ב-RRP אף גירוי לא יוצר AP','ב-ERP שום גירוי לא יוצר AP חדש; ב-RRP גירוי חזק מהרגיל יכול ליצור AP קטן ואיטי','ERP קיים רק בתאי קוצב, RRP רק במיוציטים','אין הבדל – שני השמות לאותה תקופה'],a:1,e:'ב-ERP (שלב 0 עד אמצע שלב 3) שערי האינאקטיבציה של תעלות ה-Na⁺ סגורים. ב-RRP (עד תחילת שלב 4) חלק מהתעלות התאוששו, וגירוי חזק יכול לפתוח מספיק מהן ליצירת AP מופחת. מהירות מיתוג השערים קובעת ERP; מהירות השיקום קובעת RRP.'},
{s:'extra',t:'elec',q:'תרופה המאריכה את פוטנציאל הפעולה ואת התקופה הרפרקטורית של תאי הלב (למשל חוסם תעלות אשלגן) עשויה לשמש לטיפול ב:',o:['חסם AV דרגה 1','פרפור עליות – כי מעגלי הגירוי החוזרים "נתקעים" ברקמה רפרקטורית','ברדיקרדיה סינוסית','בצקת'],a:1,e:'מההרצאה (סוטלול): הארכת ה-ERP מורידה את התדירות המקסימלית שבה תא יכול לירות, המעגלים בעלייה נכבים וה-SA node חוזר להיות הקוצב. זו גישת rhythm control.'},
{s:'extra',t:'elec',q:'מהו ההבדל במהירות ההולכה בין ה-<i class="en">AV node</i> לסיבי פורקיניה, ומה משמעותו?',o:['AVN מהיר (1–4 מ׳/שנ׳), פורקיניה איטיים – כך החדרים מתכווצים בהדרגה','AVN איטי (0.02–0.1 מ׳/שנ׳) – יוצר השהיה; פורקיניה מהירים (1–4 מ׳/שנ׳) – מפיצים את הגירוי לכל החדרים כמעט בו-זמנית','שניהם מוליכים באותה מהירות','AVN לא מוליך כלל'],a:1,e:'ההולכה האיטית ב-AVN נובעת מתאים איטיים (upstroke של סידן) ומעט gap junctions. פורקיניה – תאים גדולים עם הרבה gap junctions – מהירים פי 50, כך שכל שריר החדרים מתדפלרז תוך ~60 ms ומתכווץ מסונכרן, מהקודקוד לבסיס.'},
{s:'extra',t:'elec',q:'מה ההשפעה של גירוי פרה-סימפתטי (אצטילכולין) על תאי ה-<i class="en">SA node</i>?',o:['הגברת I<sub>f</sub> ו-I<sub>Ca</sub> – שלב 4 תלול יותר','פתיחת תעלות K<sub>ACh</sub> → היפרפולריזציה, ודיכוי I<sub>f</sub> ו-I<sub>Ca</sub> → שלב 4 שטוח יותר → קצב איטי','חסימת תעלות הנתרן המהירות','קיצור התקופה הרפרקטורית'],a:1,e:'ACh על רצפטור M₂: פוטנציאל המנוחה נעשה שלילי יותר (רחוק מהסף), שיפוע פוטנציאל הקוצב קטן, הסף עולה מעט – לוקח יותר זמן להגיע ל-AP → אפקט כרונוטרופי שלילי.'},
{s:'extra',t:'elec',q:'מהו "אפקט כרונוטרופי חיובי"?',o:['הגברת עוצמת הכיווץ של החדרים','הגברת מהירות ההולכה ב-AV node','העלאת קצב הלב','הגברת מהירות ההרפיה'],a:2,e:'Chrono = זמן → קצב. אינוטרופי = כוח כיווץ, דרומוטרופי = מהירות הולכה, לוזיטרופי = הרפיה. הסימפתטי מעלה את כולם; הוואגוס מוריד בעיקר כרונו ודרומו.'},
{s:'extra',t:'elec',q:'מהו הסדר הנכון של האירועים בפוטנציאל פעולה של תא שריר חדר?',o:['כניסת Na⁺ מהירה → יציאת K⁺ חולפת (I<sub>to</sub>) → plateau של Ca²⁺/K⁺ → רה-פולריזציה ע"י K⁺ → מנוחה','כניסת Ca²⁺ איטית → כניסת Na⁺ → יציאת K⁺','יציאת K⁺ → כניסת Na⁺ → כניסת Ca²⁺','כניסת Na⁺ → כניסת Ca²⁺ → כניסת K⁺'],a:0,e:'שלב 0 (Na⁺), שלב 1 (I<sub>to</sub>), שלב 2 (Ca²⁺ נכנס מול K⁺ יוצא), שלב 3 (K⁺ יוצא, תעלות Ca באינאקטיבציה), שלב 4 (מנוחה, I<sub>K1</sub>).'},
/* ---------- אק"ג ---------- */
{s:'extra',t:'ecg',q:'מה מייצג גל ה-T באק"ג?',o:['דה-פולריזציה של העליות','דה-פולריזציה של החדרים','רה-פולריזציה של החדרים','רה-פולריזציה של העליות'],a:2,e:'T = רה-פולריזציה של החדרים (שלב 3 של ה-AP). רה-פולריזציית העליות "נבלעת" בתוך ה-QRS. T חיובי כמו QRS כי הרה-פולריזציה מתקדמת בכיוון הפוך לדה-פולריזציה (מהאפיקרד לאנדוקרד).'},
{s:'extra',t:'ecg',q:'מרווח PR באק"ג מייצג בעיקר:',o:['את זמן הדה-פולריזציה של החדרים','את זמן ההולכה מהעליות לחדרים, בעיקר ההשהיה ב-AV node','את זמן הרה-פולריזציה של העליות','את משך ה-plateau'],a:1,e:'PR נמדד מתחילת P עד תחילת QRS (0.12–0.20 שנייה) = AV conduction time. הארכה מעבר ל-0.20 = חסם AV דרגה 1.'},
{s:'extra',t:'ecg',q:'באק"ג נראים גלי P תקינים לפני כל QRS, אך מרווח ה-PR הוא 0.26 שנייה בכל הפעימות. מהי האבחנה?',o:['פרפור עליות','חסם AV דרגה 1','חסם AV דרגה 2','טכיקרדיה חדרית'],a:1,e:'PR &gt; 0.20 שנייה (200 ms) עם העברה של כל גל P = חסם AV דרגה 1: השהיה מוגברת ב-AVN. בדרגה 2 חלק מגלי ה-P לא מלווים ב-QRS.'},
{s:'extra',t:'ecg',q:'חולה מגיע עם דופק מהיר ולא סדיר. באק"ג: אין גלי P מזוהים, קו הבסיס רועד, קומפלקסי QRS צרים במרווחים לא סדירים לחלוטין. מהי האבחנה?',o:['סינוס טכיקרדיה','טכיקרדיה חדרית','פרפור עליות','חסם AV דרגה 2'],a:2,e:'פרפור עליות: מוקדים רבים בעליות יורים בכאוס → אין P מאורגן; ה-AVN מעביר חלק אקראי מהגירויים → QRS לא סדירים. QRS צרים כי ההולכה בחדרים תקינה (דרך His–Purkinje).'},
{s:'extra',t:'ecg',q:'מדוע מקטע ה-ST תקין הוא איזואלקטרי (שטוח, בגובה קו הבסיס)?',o:['כי בשלב זה אין פעילות חשמלית בלב כלל','כי כל תאי החדרים נמצאים יחד ב-plateau (שלב 2) ואין הפרשי פוטנציאל ביניהם','כי העליות מתרפלרזות','כי ה-AV node חוסם את ההולכה'],a:1,e:'אק"ג מודד הפרשי פוטנציאל בין אזורים. ב-plateau כל שריר החדרים מדופלרז באותה מידה, לכן אין וקטור נטו. עלייה או ירידה של ST מופיעות כשחלק מהתאים (איסכמיים) שונים מהאחרים.'},
{s:'extra',t:'ecg',q:'קצב של 45 פעימות לדקה, סדיר, כל P ואחריו QRS, PR תקין. מהו הקצב?',o:['סינוס ברדיקרדיה','סינוס טכיקרדיה','חסם AV דרגה 2','קצב AV node'],a:0,e:'קצב סינוס (P תקין לפני כל QRS) מתחת ל-60 = סינוס ברדיקרדיה. אופייני לספורטאים (טונוס ואגלי גבוה), שינה, חוסמי β. מעל 100 = סינוס טכיקרדיה.'},
{s:'extra',t:'ecg',q:'באק"ג נראים קומפלקסי QRS רחבים (&gt;0.12 שנייה) ומהירים, סדירים, ללא גלי P. מהו הקצב ומדוע הוא מסוכן?',o:['סינוס טכיקרדיה – לא מסוכן','טכיקרדיה חדרית – הגירוי מתחיל בחדר ומתפשט לאט דרך שריר במקום דרך פורקיניה; המילוי והפליטה נפגעים ויש סיכון לפרפור חדרים','פרפור עליות – QRS רחבים מעידים על פרפור','חסם AV דרגה 1'],a:1,e:'QRS רחב = דה-פולריזציה חדרית איטית, שאינה עוברת במערכת ההולכה המהירה – מקור בחדר. בקצב מהיר אין זמן מילוי, ה-CO צונח, ו-VT עלול להתדרדר לפרפור חדרים.'},
{s:'extra',t:'ecg',q:'במהלך בדיקת אק"ג בנייר במהירות 25 מ"מ/שנ׳, מרווח ה-RR הוא 5 ריבועים גדולים. מהו קצב הלב?',o:['100 פעימות לדקה','75 פעימות לדקה','60 פעימות לדקה','50 פעימות לדקה'],a:2,e:'ריבוע גדול = 0.2 שנייה; 5 ריבועים = 1 שנייה בין פעימות → 60 פעימות לדקה. (כלל 300: 300 ÷ מספר הריבועים הגדולים.)'},
/* ---------- מחזור הלב וקולות ---------- */
{s:'extra',t:'cycle',q:'מה גורם לסגירת המסתם המיטרלי בתחילת הסיסטולה?',o:['כיווץ של שרירי המסתם','עליית הלחץ בחדר מעל הלחץ בעלייה','גירוי עצבי מה-AV node','כיווץ העלייה'],a:1,e:'מסתמי הלב פסיביים לחלוטין – נפתחים ונסגרים רק לפי הפרש לחצים. כשהחדר מתחיל להתכווץ, לחצו עובר את לחץ העלייה והדם דוחף את העלים לסגירה (S1). השרירים הפפילריים רק מונעים את היפוך העלים לתוך העלייה.'},
{s:'extra',t:'cycle',q:'במהלך הכיווץ האיזו-וולומטרי:',o:['המסתם המיטרלי פתוח והאאורטלי סגור, הנפח יורד','כל המסתמים סגורים, הנפח קבוע, הלחץ בחדר עולה בחדות','כל המסתמים פתוחים','המסתם האאורטלי פתוח והלחץ יורד'],a:1,e:'"איזו-וולומטרי" = נפח קבוע. המיטרלי כבר נסגר (הלחץ עבר את העלייה) והאאורטלי עוד לא נפתח (הלחץ לא הגיע ל-~80). הלחץ מזנק מ-~8 ל-~80 mmHg. בוויגרס – קו אנכי בין A ל-B; ב-PV loop – C→D.'},
{s:'extra',t:'cycle',q:'מה מסמן קול הלב השני (S2)?',o:['סגירת המסתמים האטריו-ונטריקולריים בתחילת הסיסטולה','סגירת המסתמים האאורטלי והפולמונלי בסוף הסיסטולה','פתיחת המסתם המיטרלי','כיווץ העלייה'],a:1,e:'S1 = סגירת מיטרלי+טריקוספידלי (תחילת סיסטולה, "lub"); S2 = סגירת אאורטלי+פולמונלי (סוף סיסטולה/תחילת דיאסטולה, "dub"). הקולות נוצרים בעיקר מזרימה מערבולתית בעת סגירת המסתם.'},
{s:'extra',t:'cycle',q:'קול לב שלישי (S3) נשמע בתחילת הדיאסטולה. באיזה מצב הוא אופייני ומה המנגנון?',o:['היענות ירודה של החדר – כיווץ העלייה לתוך חדר קשיח','אי-ספיקת לב – דם נשפך במילוי המהיר לתוך חדר מורחב ורפוי','היצרות מסתם אאורטלי','חסם AV'],a:1,e:'S3 ("gallop") מופיע בשלב המילוי המהיר, כשדם זורם בזרם לחדר שנפחו גדול ודופנו רפויה – אי-ספיקת לב. S4 הוא בסוף הדיאסטולה, בכיווץ העלייה לתוך חדר קשיח (היפרטרופיה).'},
{s:'extra',t:'cycle',q:'כשקצב הלב עולה מ-70 ל-150 פעימות לדקה, איזה חלק של מחזור הלב מתקצר באופן משמעותי ביותר?',o:['הכיווץ האיזו-וולומטרי','הפליטה','הדיאסטולה (בעיקר שלב המילוי האיטי)','הסיסטולה העלייתית'],a:2,e:'במנוחה הדיאסטולה (~0.5 ש׳) ארוכה מהסיסטולה (~0.3). כשהקצב עולה הסיסטולה מתקצרת מעט, אבל הדיאסטולה – ובעיקר ה-diastasis – מתקצרת מאוד. לכן בקצבים גבוהים מאוד המילוי נפגע ו-SV יורד.'},
{s:'extra',t:'cycle',q:'בדיאגרמת וויגרס, באיזה שלב נפח החדר הוא הגדול ביותר?',o:['בסוף הפליטה','בסוף הסיסטולה העלייתית, רגע לפני סגירת המיטרלי (EDV)','בתחילת המילוי המהיר','במהלך הכיווץ האיזו-וולומטרי'],a:1,e:'EDV נמדד בסוף הדיאסטולה, אחרי שהעלייה הוסיפה את ה-atrial kick ורגע לפני שהחדר מתחיל להתכווץ (נקודה A בוויגרס, C ב-PV loop). הנפח הקטן ביותר (ESV) – בסגירת האאורטלי.'},
{s:'extra',t:'cycle',q:'איזה אחוז ממילוי החדר מתרחש באופן פסיבי, לפני כיווץ העלייה?',o:['כ-20%','כ-50%','כ-70–80%','0% – כל המילוי תלוי בכיווץ העלייה'],a:2,e:'רוב המילוי הוא פסיבי (מילוי מהיר + diastasis); כיווץ העלייה מוסיף רק ~20–30%. לכן בפרפור עליות (אובדן ה-atrial kick) הלב עדיין מתמלא, אבל CO יורד ב-~20%, במיוחד כשהחדר קשיח.'},
{s:'extra',t:'cycle',q:'ה"חריץ" (dicrotic notch) בעקומת הלחץ של האאורטה מופיע ברגע:',o:['פתיחת המסתם האאורטלי','סגירת המסתם האאורטלי','פתיחת המסתם המיטרלי','שיא הפליטה'],a:1,e:'כשהחדר מתחיל להרפות ולחצו יורד מתחת לאאורטה, הדם נוטה לחזור, המסתם נטרק (S2) ונוצרת תנודה קטנה בלחץ האאורטה – הנקודה C בוויגרס מהבוחן.'},
/* ---------- Preload / Afterload / Inotropy ---------- */
{s:'extra',t:'mech',q:'מהי ההגדרה המדויקת של <i class="en">Preload</i>?',o:['הכוח שכנגדו הלב מתכווץ בזמן הפליטה','המתיחה/העומס על שריר הלב בסוף הדיאסטולה, רגע לפני תחילת הכיווץ – מבוטא ע"י EDV','היכולת הפנימית של השריר לפתח כוח','הלחץ המקסימלי בסיסטולה'],a:1,e:'Preload = נפח/לחץ ההתמלאות של החדר (EDV או EDP). הוא קובע את האורך ההתחלתי של הסרקומרים ואת המתח הפסיבי לפני הכיווץ. Afterload = הכוח כנגדו הלב מתכווץ; Contractility = היכולת הפנימית.'},
{s:'extra',t:'mech',q:'איזה מהבאים יגדיל את ה-<i class="en">Afterload</i> של חדר שמאל?',o:['מתן מרחיב כלי דם (ניטרופרוסיד)','ירידה בלחץ הדם','כיווץ העורקיקים הפריפריים (עליית TPR) או היצרות המסתם האאורטלי','עירוי נוזלים'],a:2,e:'Afterload תלוי בהתנגדות העורקים הפריפריים ובלחץ באאורטה – כל מה שמקשה על הפליטה. מרחיב כלי דם מקטין afterload; עירוי מגדיל preload.'},
{s:'extra',t:'mech',q:'לחולה EDV של 140 מ"ל ו-ESV של 70 מ"ל. מהו מקטע הפליטה (EF) ומה משמעותו?',o:['EF = 70% – תקין','EF = 50% – ירוד (תקין ~60%)','EF = 200% – לא אפשרי','EF = 35% – ירוד מאוד'],a:1,e:'SV = 140 − 70 = 70 מ"ל; EF = SV/EDV = 70/140 = 50%. ערך תקין ~60% (55–70%), ולכן 50% מעיד על ירידה בתפקוד. EF הוא המדד הנפוץ ביותר באקו, אבל הוא תלוי גם ב-afterload ולא רק בכיווציות.'},
{s:'extra',t:'mech',q:'מהו מקור הסידן הדרוש לכיווץ שריר הלב, ובמה זה שונה משריר השלד?',o:['רק סידן חוץ-תאי – כמו בשריר שלד','רק סידן מה-SR – כמו בשריר שלד','גם סידן חוץ-תאי (נכנס ב-plateau ומשמש טריגר) וגם סידן תוך-תאי מה-SR (CICR) – צריך את שניהם; בשריר שלד הסידן מגיע רק מה-SR','סידן מהמיטוכונדריה'],a:2,e:'בשריר לב כניסת סידן דרך תעלות L בשלב 2 מפעילה את ה-RyR ומשחררת כמות גדולה מה-SR (calcium-induced calcium release). ללא סידן חוץ-תאי הלב לא מתכווץ. בשריר שלד הצימוד DHP–RyR מכני ואינו דורש כניסת סידן.'},
{s:'extra',t:'mech',q:'כיצד דיגוקסין (מעכב Na⁺/K⁺-ATPase) מגביר את כיווציות הלב?',o:['הוא פותח ישירות תעלות סידן','עליית Na⁺ תוך-תאי מפחיתה את פעילות המחליף Na⁺/Ca²⁺ (NCX), פחות סידן יוצא מהתא, יותר סידן נאגר ב-SR ומשתחרר בכיווץ','הוא מגביר את הזרם המצחיק','הוא חוסם את SERCA'],a:1,e:'ה-NCX מוציא סידן תמורת כניסת נתרן לפי מפל הנתרן. כשהמפל קטן (Na⁺ תוך-תאי גבוה), הוצאת הסידן יורדת → ↑Ca²⁺ ציטוזולי ו-SR → אפקט אינוטרופי חיובי.'},
{s:'extra',t:'mech',q:'מהו המדד הטוב ביותר לכיווציות (<i class="en">contractility</i>) של החדר?',o:['לחץ הדם הסיסטולי','מקטע הפליטה (EF)','שיפוע ה-ESPVR (E<sub>es</sub>) או dP/dt מקסימלי','נפח סוף-דיאסטולי'],a:2,e:'כיווציות מוגדרת כיכולת הפנימית ללא תלות בעומסים. לחץ הדם ו-EF משתנים גם עם preload ו-afterload (למשל ↑afterload מוריד EF בלי שינוי בכיווציות), ולכן אינם מדדים טובים. שיפוע ה-ESPVR משתנה רק עם אינוטרופיה.'},
{s:'extra',t:'mech',q:'כיצד קטכולאמינים משפרים גם את הכיווץ וגם את ההרפיה של שריר הלב?',o:['הם מעכבים את SERCA ואת תעלות הסידן','דרך β₁ → cAMP → PKA: זרחון תעלות Ca²⁺ (יותר סידן נכנס → כיווץ חזק), זרחון פוספולמבאן (SERCA מהיר יותר → הרפיה מהירה) וזרחון טרופונין I','הם מגבירים את מספר הסרקומרים','הם מורידים את ריכוז הסידן בתא'],a:1,e:'התוצאה: פעימה חזקה, מסונכרנת וקצרה. ההרפיה המהירה מאפשרת מילוי יעיל גם כשהדיאסטולה קצרה, ולכן הסימפתטי יכול להעלות את הקצב בלי לאבד את המילוי – הספק (CO) עולה.'},
{s:'extra',t:'mech',q:'מה יקרה לנפח הפעימה אם העלאת קצב הלב מ-70 ל-180 פעימות לדקה תתרחש ללא שינוי בכיווציות?',o:['SV יעלה כי הלב מתכווץ יותר פעמים','SV יישאר זהה','SV ירד משמעותית בגלל קיצור זמן המילוי הדיאסטולי','SV יעלה בגלל פרנק-סטרלינג'],a:2,e:'בקצב 180 הדיאסטולה קצרה מאוד, EDV יורד ולכן SV יורד. במאמץ אמיתי הסימפתטי מפצה: הרפיה מהירה (לוזיטרופיה), כיווציות ↑ והחזר ורידי ↑ שומרים על SV.'},
/* ---------- PV loop ופרנק-סטרלינג ---------- */
{s:'extra',t:'pv',q:'מה קובע חוק פרנק-סטרלינג?',o:['ככל שההתנגדות הפריפרית עולה – נפח הפעימה עולה','ככל שאורך הסיב ההתחלתי (נפח המילוי) גדול יותר – הכוח שהסיב מפתח ונפח הפעימה גדולים יותר, עד גבול','קצב הלב קובע את נפח הפעימה','הכיווציות תלויה בקצב הלב'],a:1,e:'מנגנון מקומי (intrinsic): מתיחה מסדרת את הסרקומרים באורך אופטימלי ומגבירה את רגישות הטרופונין לסידן. מאפשר ללב להתאים את הפליטה להחזר הוורידי ולאזן בין לב ימין לשמאל ללא עצבים.'},
{s:'extra',t:'pv',q:'ב-PV loop, שינוי באיזה גורם משנה את שיפוע ה-ESPVR?',o:['Preload','Afterload','כיווציות (Inotropy)','קצב הלב בלבד'],a:2,e:'ה-ESPVR (קו נקודות סוף-הסיסטולה) מקביל לעקומה האקטיבית של פרנק-סטרלינג. שינוי ב-preload או ב-afterload מזיז את הלולאה לאורך הקו בלי לשנות את שיפועו; רק שינוי בכיווציות משנה את השיפוע (E<sub>es</sub>).'},
{s:'extra',t:'pv',q:'מה מבטא ה-EDPVR (<i class="en">End-Diastolic Pressure-Volume Relationship</i>)?',o:['את הכיווציות של החדר','את ההיענות (compliance) של החדר – המתח הפסיבי בעת המילוי; מקביל לעקומה הפסיבית של פרנק-סטרלינג','את ה-afterload','את קצב הלב'],a:1,e:'בלב קשיח (היפרטרופיה, איסכמיה) ה-EDPVR תלול – שינוי קטן בנפח מעלה הרבה את הלחץ הדיאסטולי (ואת הלחץ בעלייה ובריאות). בלב אלסטי השיפוע שטוח.'},
{s:'extra',t:'pv',q:'מתן עירוי נוזלים מהיר (הגדלת preload) בלב בריא, כשה-afterload והכיווציות קבועים, יגרום ל:',o:['↑EDV, ESV כמעט ללא שינוי, ↑SV, ↑EF, הלולאה מתרחבת ימינה','↑EDV, ↑ESV, ↓SV','↓EDV, ↓SV','שינוי בשיפוע ה-ESPVR'],a:0,e:'ניסוי 4 מההרצאה: הלולאה זזה ימינה על אותו EDPVR; נקודת סוף-הסיסטולה נשארת על אותו ESPVR ולכן ESV כמעט לא משתנה; SV ו-EF גדלים. גם לחץ הדם עולה – ולכן לחץ הדם אינו מדד טוב ל-afterload.'},
{s:'extra',t:'pv',q:'מתן נוראדרנלין במינון המכווץ עורקיקים (עליית TPR) בלב מבודד עם preload וכיווציות קבועים יגרום ל:',o:['↑SV, ↓ESV','↑לחץ סיסטולי, ↑ESV, ↓SV, ↓EF – הלולאה נעשית גבוהה וצרה','שינוי בשיפוע ה-EDPVR','↓לחץ סיסטולי'],a:1,e:'ניסוי 5: עליית afterload – החדר צריך לבנות לחץ גבוה יותר לפני שהאאורטלי נפתח, הפליטה נגמרת מוקדם יותר על אותו ESPVR → נפח שאריתי גדול, SV קטן. בלב שלם, אחרי כמה פעימות ה-ESV הגדול מעלה את ה-EDV ופרנק-סטרלינג מפצה חלקית.'},
{s:'extra',t:'pv',q:'בלב עם ירידה בכיווציות (אי-ספיקת לב), כיצד תיראה לולאת הלחץ-נפח בהשוואה ללב בריא?',o:['ESPVR תלול יותר, ESV קטן','ESPVR שטוח יותר, ESV גדול, SV ו-EF קטנים, ועם הזמן EDV גדל (הלב מתרחב)','לולאה זהה אך בלחץ גבוה יותר','EDPVR שטוח יותר'],a:1,e:'ניסוי 6: ירידה באינוטרופיה משטחת את ה-ESPVR, הלב לא מצליח להתרוקן (ESV ↑), SV ↓. הנפח השאריתי מצטבר, EDV עולה והלב "נשען" על פרנק-סטרלינג (ועל הסימפתטי) כדי לשמור על CO – על חשבון לחץ מילוי גבוה ובצקת.'},
{s:'extra',t:'pv',q:'מהו השטח הכלוא בתוך לולאת הלחץ-נפח?',o:['נפח הפעימה','עבודת הפעימה (stroke work) – העבודה החיצונית שהחדר מבצע בפעימה אחת','מקטע הפליטה','ה-afterload'],a:1,e:'עבודה = לחץ × נפח. השטח בתוך הלולאה = עבודת הפליטה של פעימה אחת. במאמץ (preload ↑, כיווציות ↑, afterload ↑) הלולאה גדולה בהרבה והעבודה עולה. ה-PV loop לא מכיל ציר זמן ולכן לא מתאר שינויים ב-SV עם הזמן.'},
{s:'extra',t:'pv',q:'מדוע הלב יכול להשתמש בפרנק-סטרלינג כדי לאזן את התפוקה של לב ימין ולב שמאל?',o:['כי שני החדרים מקבלים גירוי סימפתטי זהה','כי אם לב ימין פולט יותר, יותר דם מגיע ללב שמאל, שנמתח יותר ופולט יותר – תוך פעימות ספורות התפוקות משתוות ללא צורך בעצבים','כי ה-AV node מתאם ביניהם','כי המחיצה מעבירה דם בין החדרים'],a:1,e:'זהו מנגנון intrinsic: "הלב פולט מה שהוא מקבל". אחרת, הבדל קטן בין המשאבות היה מצטבר תוך דקות לבצקת ריאות או להתרוקנות הריאות מדם.'},
/* ---------- כלי דם והמודינמיקה ---------- */
{s:'extra',t:'vess',q:'אם רדיוס של עורקיק מוכפל (פי 2) ושאר הגורמים קבועים, מה יקרה לזרימה דרכו?',o:['תגדל פי 2','תגדל פי 4','תגדל פי 16','תקטן פי 2'],a:2,e:'לפי פואזיי R ∝ 1/r⁴, ולכן Q ∝ r⁴. 2⁴ = 16. מהאיור בהרצאה: קוטר 1 → 1 מ"ל/דקה, 2 → 16, 4 → 256. לכן שינויים קטנים ברדיוס העורקיקים הם כלי השליטה העיקרי על זרימת הדם.'},
{s:'extra',t:'vess',q:'איזה סוג כלי דם תורם את החלק הגדול ביותר להתנגדות הפריפרית הכוללת (TPR) ולנפילת לחץ הדם?',o:['האאורטה והעורקים הגדולים','העורקיקים','הנימים','הוורידים'],a:1,e:'העורקיקים – דופן שרירית עבה יחסית לקוטר ורדיוס קטן; הנפילה החדה ביותר בלחץ מתרחשת בהם ("כלי ההתנגדות"). הנימים צרים יותר אך הם מיליארדים במקביל, ולכן התנגדותם הכוללת קטנה יותר.'},
{s:'extra',t:'vess',q:'היכן מהירות זרימת הדם היא הנמוכה ביותר ומדוע?',o:['באאורטה – כי הלחץ גבוה','בנימים – כי שטח החתך הכולל שלהם (במקביל) הוא הגדול ביותר, והמהירות הפוכה לשטח החתך','בוורידים – כי הלחץ נמוך','בעורקיקים – כי ההתנגדות גבוהה'],a:1,e:'Q = v × A והזרימה (Q) זהה בכל רמה של המערכת. בנימים A ≈ 1,400–4,500 סמ"ר לעומת ~4.5 באאורטה → המהירות יורדת מ-~50 ס"מ/שנ׳ ל-&lt;0.1 ס"מ/שנ׳ – זמן לחילוף חומרים. המהירות לא תלויה במרחק מהלב.'},
{s:'extra',t:'vess',q:'היכן נמצא רוב נפח הדם בגוף במנוחה?',o:['בעורקים (~60%)','בנימים (~40%)','בוורידים (~65–70%) – כלי הקיבולת','בלב'],a:2,e:'הוורידים דקי דופן ובעלי היענות גבוהה (פי ~20 מעורקים) ולכן אוגרים את רוב הדם בלחץ נמוך. העורקים ~11%, הנימים רק ~5% (קצרים מאוד למרות שטח החתך העצום). כיווץ ורידים סימפתטי מגייס דם מהמאגר ומגדיל preload.'},
{s:'extra',t:'vess',q:'לחץ דם של 130/70 mmHg. מהו ה-MAP המשוער?',o:['100 mmHg','90 mmHg','115 mmHg','80 mmHg'],a:1,e:'MAP ≈ דיאסטולי + ⅓ × לחץ דופק = 70 + (60/3) = 90. הממוצע קרוב לדיאסטולי כי הדיאסטולה נמשכת כ-⅔ מהמחזור.'},
{s:'extra',t:'vess',q:'מה מתאר מנגנון ה-Windkessel ("מנגנון אבי העורקים")?',o:['כיווץ פעיל של האאורטה בדיאסטולה','האאורטה האלסטית נמתחת בסיסטולה ואוגרת חלק מנפח הפעימה, ומתכווצת חזרה בדיאסטולה – כך הזרימה בנימים רציפה והלחץ הדיאסטולי לא צונח','מסתם שמונע חזרת דם מהאאורטה','ויסות הלחץ ע"י הכליה'],a:1,e:'זה תפקיד ההיענות העורקית: הופכת זרימה פעימתית לרציפה. בעורקים קשיחים (גיל, טרשת) האגירה קטנה → סיסטולי גבוה, דיאסטולי נמוך, לחץ דופק רחב.'},
{s:'extra',t:'vess',q:'לפי משוואת ברנולי, מה קורה ללחץ הצידי של הדם באזור של היצרות בכלי דם?',o:['הלחץ עולה כי הדם נדחס','הלחץ יורד כי מהירות הזרימה עולה והאנרגיה הקינטית גדלה על חשבון אנרגיית הלחץ','הלחץ לא משתנה','הלחץ עולה כי ההתנגדות עולה'],a:1,e:'P + ½ρv² = קבוע: בהיצרות A קטן → v גדול → P צידי קטן. זה מסביר את מפל הלחץ בהיצרות מסתם אאורטלי ואת האוושה (זרימה מהירה ומערבולתית).'},
{s:'extra',t:'vess',q:'עלייה בהמטוקריט (למשל בפוליציטמיה) תגרום ל:',o:['ירידה בצמיגות הדם וירידה בהתנגדות','עלייה בצמיגות הדם, עלייה בהתנגדות לזרימה ועלייה בעבודת הלב','ירידה בלחץ הדם','עלייה במהירות הזרימה בנימים'],a:1,e:'ההמטוקריט הוא הגורם העיקרי לצמיגות הדם (η בנוסחת פואזיי). הצמיגות עולה באופן לא ליניארי עם ההמטוקריט – בערכים גבוהים הזרימה מואטת מאוד.'},
{s:'extra',t:'vess',q:'מהי ההגדרה של היענות (compliance) ואיזה כלי דם הם בעלי ההיענות הגבוהה ביותר?',o:['C = ΔP/ΔV; העורקים','C = ΔV/ΔP – שינוי הנפח ליחידת שינוי בלחץ; הוורידים (פי ~20 מהעורקים)','C = Q/ΔP; הנימים','C = ΔV/ΔP; האאורטה'],a:1,e:'הוורידים קולטים נפח גדול בשינוי לחץ קטן – ולכן הם מאגר הדם של הגוף. העורקים – היענות נמוכה: תוספת נפח קטנה (SV) מעלה את הלחץ ב-40 mmHg (לחץ הדופק).'},
{s:'extra',t:'vess',q:'מה קובע את לחץ הדם העורקי הממוצע (MAP) ברמת המערכת?',o:['רק קצב הלב','תפוקת הלב (SV × HR) × ההתנגדות הפריפרית הכוללת (TPR)','רק נפח הדם','המטוקריט'],a:1,e:'MAP ≈ CO × TPR (+לחץ ורידי מרכזי) – המקבילה של חוק אוהם. שינוי בכל אחד מ-HR, SV (preload, afterload, inotropy) או TPR (רדיוס העורקיקים) משנה את הלחץ; היענות העורקים ונפח הדם קובעים את הצד הפיזיקלי.'},
{s:'extra',t:'vess',q:'במדידת לחץ דם עם שרוול, קולות קורוטקוף נשמעים:',o:['כשלחץ השרוול גבוה מהסיסטולי – זרימה מערבולתית','כשלחץ השרוול בין הסיסטולי לדיאסטולי – העורק נפתח חלקית בכל סיסטולה וזרימה מערבולתית יוצרת רעש','כשלחץ השרוול נמוך מהדיאסטולי – זרימה למינרית','רק בחולים עם אוושה'],a:1,e:'מעל הסיסטולי העורק חסום – שקט. בין הערכים – זרימה חלקית ומערבולתית – קולות. מתחת לדיאסטולי – זרימה רציפה למינרית – שקט. הופעת הקולות = סיסטולי, היעלמותם = דיאסטולי.'},
/* ---------- נימים וכוחות סטרלינג ---------- */
{s:'extra',t:'cap',q:'מהו המנגנון העיקרי לחילוף חומרים (גזים, מומסים, מים) בין הדם לרקמות?',o:['פילטרציה','דיפוזיה','פינוציטוזה','טרנספורט אקטיבי'],a:1,e:'דיפוזיה היא המנגנון הדומיננטי לחילוף חומרים (חוק פיק). פילטרציה/ספיגה (כוחות סטרלינג) קובעות את מאזן הנוזלים בין הפלזמה לרקמה, אבל לא את ההזנה. פינוציטוזה – מולקולות גדולות.'},
{s:'extra',t:'cap',q:'לפי חוק פיק (<i class="en">Fick</i>), קצב הדיפוזיה של חומר דרך דופן הנימה <b>אינו</b> תלוי ב:',o:['בשטח פני הנימה','בחדירות הנימה לחומר','בהפרש הריכוזים בין הדם לרקמה','בלחץ ההידרוסטטי בנימה'],a:3,e:'J = P·S·ΔC: חדירות, שטח ומפל ריכוז (וביחס הפוך – מרחק הדיפוזיה). הלחץ ההידרוסטטי מניע פילטרציה (bulk flow), לא דיפוזיה.'},
{s:'extra',t:'cap',q:'אספקת חמצן לשריר שלד פעיל שהנימים צמודים אליו היא "מוגבלת זרימה" (<i class="en">flow-limited</i>). מה המשמעות?',o:['החמצן לא מצליח לעבור את דופן הנימה','החמצן מתאזן כבר בתחילת הנימה, ולכן הדרך היחידה להגדיל את האספקה היא להגביר את זרימת הדם (הרחבת עורקיקים, גיוס נימים)','צריך להגדיל את ריכוז החמצן בדם','החמצן מוגבל ע"י מרחק הדיפוזיה'],a:1,e:'חומרים שחודרים בקלות (גזים, מים) מוגבלים רק ע"י כמות הדם שמגיעה. לעומתם, גלוקוז לפיברובלסט בגיד (מעט נימים, מרחק גדול) מוגבל-דיפוזיה – הגדלת הזרימה לא תעזור.'},
{s:'extra',t:'cap',q:'מהם ארבעת כוחות סטרלינג ולאיזה כיוון כל אחד פועל?',o:['P<sub>c</sub> ו-π<sub>c</sub> החוצה; P<sub>i</sub> ו-π<sub>i</sub> פנימה','P<sub>c</sub> (הידרוסטטי בנימה) ו-π<sub>i</sub> (אונקוטי ברקמה) דוחפים נוזל החוצה; π<sub>c</sub> (אונקוטי בפלזמה) ו-P<sub>i</sub> (הידרוסטטי ברקמה) מושכים פנימה','כולם פועלים החוצה בצד העורקי ופנימה בצד הוורידי','P<sub>c</sub> פנימה, π<sub>c</sub> החוצה'],a:1,e:'NF = K<sub>f</sub>[(P<sub>c</sub> − P<sub>i</sub>) − σ(π<sub>c</sub> − π<sub>i</sub>)]. שני הכוחות הגדולים: P<sub>c</sub> (35→15) החוצה ו-π<sub>c</sub> (~25) פנימה. בצד העורקי P<sub>c</sub> מנצח – פילטרציה; בצד הוורידי π<sub>c</sub> מנצח – ספיגה.'},
{s:'extra',t:'cap',q:'מדוע לאלבומין יש השפעה אוסמוטית גדולה מכפי שמשתמע מריכוזו המולרי?',o:['כי הוא מולקולה גדולה מאוד','כי הוא טעון שלילית ומספח קטיונים (Na⁺) שמוסיפים לאפקט האוסמוטי (אפקט Gibbs–Donnan)','כי הוא עובר בקלות את דופן הנימה','כי הוא נקשר למים'],a:1,e:'האלבומין הוא החלבון הרב ביותר בפלזמה ומייצר את רוב ה-~25 mmHg של הלחץ האונקוטי. מקדם ההחזרה שלו σ ≈ 1 (לא עובר), לעומת 0 למים. ירידה באלבומין (כבד, כליה, תת-תזונה) → בצקת.'},
{s:'extra',t:'cap',q:'איזה מהמצבים הבאים יגרום לבצקת דרך <b>עלייה בלחץ ההידרוסטטי</b> בנימים?',o:['סינדרום נפרוטי','שחמת כבד','אי-ספיקת לב ימנית / פקקת ורידים ברגל – עליית הלחץ הוורידי','תגובה אלרגית עם היסטמין'],a:2,e:'עליית הלחץ הוורידי מועברת אחורה לנימים (↑P<sub>c</sub>) לאורך כל הנימה – הפילטרציה גוברת על הספיגה (המקרה ההידרוסטטי מההרצאה). סינדרום נפרוטי ושחמת – ↓אלבומין (אונקוטי); היסטמין – ↑חדירות.'},
{s:'extra',t:'cap',q:'מה תפקיד מערכת הלימפה במאזן הנוזלים בנימים?',o:['היא מסננת את הדם','היא מחזירה למחזור הדם את עודף הנוזל המסונן (~10%, 2–4 ליטר ביום) ואת החלבונים שדלפו מהנימים לרקמה','היא מייצרת אלבומין','היא מווסתת את לחץ הדם העורקי'],a:1,e:'הנוזל המסונן עולה על הנספג; הלימפה (נימים עיוורים עם מסתמים חד-כיווניים, משאבת שרירים) מנקזת את העודף לווריד התת-בריחי. חסימת לימפה → לימפאדמה עשירה בחלבון. בלי הלימפה π<sub>i</sub> היה עולה בהדרגה ומושך עוד נוזל.'},
{s:'extra',t:'cap',q:'באיזה חלק של הנימה החדירות (פרמיאביליות) גבוהה יותר, ובאיזה איבר היא כמעט אפסית?',o:['בצד העורקי; בכבד','בצד הוורידי (יותר נקבוביות); במוח (מחסום דם-מוח)','שווה לכל האורך; בכליה','בצד העורקי; במוח'],a:1,e:'מההרצאה: החדירות משתנה בין איברים (אפסית במוח, גדולה בכבד/כליה) ולאורך הנימה (גבוהה יותר בצד הוורידי). היא תלויה בסוג וגודל הנקבוביות ובממברנת הבסיס שמסננת לפי גודל ומטען.'},
{s:'extra',t:'cap',q:'כיצד ויסות קוטר העורקיקים משפיע על הלחץ ההידרוסטטי בנימים (P<sub>c</sub>)?',o:['הרחבת העורקיק מורידה את P<sub>c</sub>','הרחבת העורקיק (ירידה בהתנגדות הקדם-נימית) מעלה את P<sub>c</sub> ומגבירה פילטרציה; כיווץ מוריד P<sub>c</sub>','קוטר העורקיק משפיע רק על הלחץ הוורידי','אין קשר'],a:1,e:'P<sub>c</sub> נקבע ע"י היחס בין ההתנגדות הקדם-נימית (עורקיק + סוגר) לבתר-נימית (ורידון). עיקר הוויסות בצד העורקי, לפי הצורך בחילוף חומרים; אבל שינוי בלחץ הוורידי משפיע על P<sub>c</sub> באופן ישיר יותר.'},
/* ---------- בקרה עצבית ורפלקסים ---------- */
{s:'extra',t:'ans',q:'מהו המוליך העצבי והרצפטור שדרכם המערכת הסימפתטית פועלת על הלב?',o:['אצטילכולין על רצפטור מוסקריני M₂','נוראפינפרין על רצפטור β₁ אדרנרגי → ↑cAMP','דופמין על רצפטור D₁','אצטילכולין על רצפטור ניקוטיני'],a:1,e:'NE מהסיבים הפוסט-גנגליוניים (ואדרנלין מהאדרנל) על β₁ → G<sub>s</sub> → אדנילט ציקלאז → cAMP → PKA → זרחון תעלות Ca, פוספולמבאן, I<sub>f</sub>. הפרה-סימפתטי: ACh על M₂ → G<sub>i</sub> → ↓cAMP ופתיחת K<sub>ACh</sub>.'},
{s:'extra',t:'ans',q:'איזו מערכת דומיננטית בבקרה על קצב הלב במנוחה, וכיצד הוכיחו זאת?',o:['הסימפתטית – פרופרנולול מוריד את הקצב מאוד','הפרה-סימפתטית – אטרופין (חוסם מוסקריני) מעלה את הקצב בהרבה (~65→115), בעוד פרופרנולול (חוסם β) מוריד אותו רק מעט','שתיהן באותה מידה','אף אחת – הקצב נקבע רק ע"י הקוצב'],a:1,e:'הקצב הפנימי של ה-SAN הוא ~100; הוואגוס מוריד אותו ל-~70. חסימת שתי המערכות (או לב מושתל) מחזירה ל-~100. לכן אטרופין = מעכב פרה-סימפתטי; פרופרנולול = מעכב סימפתטי.'},
{s:'extra',t:'ans',q:'היכן נמצאים הברורצפטורים ומה תגובתם לעליית לחץ דם?',o:['בעליות; מגבירים את הדופק','בקשת האאורטה ובסינוס הקרוטידי; עלייה בלחץ מגבירה את הירי → ↑ואגוס, ↓סימפתטי → ↓HR, ↓כיווציות, הרחבת כלי דם','בגופיפי הקרוטיד; מגיבים לירידה בחמצן','בכליה; מפרישים רנין'],a:1,e:'זהו הרפלקס המהיר ביותר לבקרת לחץ (שניות). בירידת לחץ (עמידה, דימום) – ההפך: ↑סימפתטי → ↑HR, ↑כיווציות, כיווץ עורקיקים וורידים. הרפלקס מתאפס ללחץ חדש תוך ימים.'},
{s:'extra',t:'ans',q:'מהו רפלקס ביינברידג׳ (<i class="en">Bainbridge</i>)?',o:['עליית לחץ עורקי → האטת הדופק','עליית לחץ/נפח בעליות (מתיחת רצפטורים עלייתיים) → האצת הדופק; במקביל מופרש ANP הגורם לשיתון','ירידה בחמצן → האטת הדופק','שאיפה → האטת הדופק'],a:1,e:'מטרת הרפלקס: לפנות במהירות עודף נפח שמגיע ללב (עירוי, ↑החזר ורידי) ולמנוע הצטברות דם בוורידים. ביינברידג׳ דומיננטי כשנפח הדם גדול; הברורצפטורים דומיננטיים כשנפח הדם קטן.'},
{s:'extra',t:'ans',q:'מה תפקידו של ANP (<i class="en">Atrial Natriuretic Peptide</i>)?',o:['מופרש מהכליה ומעלה את לחץ הדם','מופרש מהעליות בתגובה למתיחה; גורם לשיתון ונטריאורזיס, להרחבת כלי דם ולעיכוב רנין-אלדוסטרון → ירידת נפח הדם','מופרש מהאדרנל ומגביר כיווציות','מופרש מהמוח ומעלה את קצב הלב'],a:1,e:'ANP הוא ההורמון של "עודף נפח": מתיחת העליות → ANP → הכליה מפנה נתרן ומים, הכלים מתרחבים, RAAS מעוכב. משלים את רפלקס ביינברידג׳.'},
{s:'extra',t:'ans',q:'בהפרעת קצב סינוס נשימתית (<i class="en">sinus arrhythmia</i>):',o:['הדופק יורד בשאיפה ועולה בנשיפה','הדופק עולה בשאיפה ויורד בנשיפה – תופעה תקינה, בולטת בצעירים','הדופק לא סדיר לחלוטין ללא קשר לנשימה','גלי P נעלמים'],a:1,e:'בשאיפה: מרכז הנשימה מעכב את המרכז הוואגלי, מתיחת הריאות מעכבת ואגוס, והלחץ התוך-חזי השלילי מגביר החזר ורידי → ביינברידג׳ → ↑HR. כמה פעימות אחר כך ↑CO מפעיל ברורצפטורים → ↓HR (בנשיפה). באק"ג: RR משתנה מחזורית עם P תקין.'},
{s:'extra',t:'ans',q:'מהי ההשפעה הישירה (ראשונית) של גירוי הכימורצפטורים ההיקפיים ע"י היפוקסיה על הלב, ומדוע בפועל הדופק בדרך כלל עולה?',o:['ישירות ↑HR; בפועל יורד בגלל הנשימה','ישירות ↓HR (גירוי המרכז הוואגלי); בפועל עולה כי ההיפוקסיה מגבירה את הנשימה, ומתיחת הריאות וירידת CO₂ מעכבות את הוואגוס','אין השפעה על הלב','ישירות כיווץ כלי דם כלילי'],a:1,e:'מההרצאה: תגובת הלב לירידת החמצן – ראשונית ברדיקרדיה (ניסוי מבוקר, הגרף של HR מול סטורציה), אבל ההשפעה המשנית דרך הנשימה הופכת אותה לטכיקרדיה בבני אדם נושמים. בעצירת נשימה (צלילה) – ברדיקרדיה.'},
{s:'extra',t:'ans',q:'הגירוי הפרה-סימפתטי משפיע באופן משמעותי על:',o:['כיווציות החדרים','קצב הלב (SAN) ומהירות ההולכה ב-AVN; השפעה מועטה על כיווציות החדרים','התנגדות העורקיקים','מקטע הפליטה בלבד'],a:1,e:'העצבוב הוואגלי לחדרים דל. לכן "האינוטרופיה היא השפעה סימפתטית בלבד" (מההרצאה); הוואגוס מוריד HR, מאט AVN (PR מתארך) ומוריד מעט כיווציות של העליות.'},
{s:'extra',t:'ans',q:'אדם בריא עומד בפתאומיות משכיבה. מהו רצף האירועים?',o:['↑החזר ורידי → ↑CO → ברורצפטורים → ↓HR','דם מצטבר בוורידי הרגליים → ↓החזר ורידי → ↓preload → ↓SV → ↓לחץ דם → ↓ירי ברורצפטורים → ↑סימפתטי, ↓ואגוס → ↑HR, ↑כיווציות, כיווץ עורקיקים וורידים → הלחץ מתאושש','ביינברידג׳ → ↑HR','ANP → שיתון'],a:1,e:'זהו רפלקס הברורצפטורים בכיוון ההפוך. כשל ברפלקס (גיל, תרופות, נוירופתיה) → תת-לחץ דם אורתוסטטי וסחרחורת.'},
/* ---------- בקרה על HR ו-SV ---------- */
{s:'extra',t:'sv',q:'מהו ההבדל בין בקרה מקומית (<i class="en">intrinsic</i>) לבקרה סיסטמית (<i class="en">extrinsic</i>) על נפח הפעימה?',o:['מקומית = הורמונים; סיסטמית = עצבים','מקומית = מנגנונים בתוך שריר הלב עצמו (פרנק-סטרלינג, בקרה תלוית קצב) שפועלים גם בלב מבודד; סיסטמית = עצבים אוטונומיים, הורמונים וגזים בדם','מקומית = רק בעליות; סיסטמית = רק בחדרים','אין הבדל'],a:1,e:'הבקרה המקומית מתאימה את SV ל-preload ולקצב ללא תלות בגוף; הסיסטמית משנה את הכיווציות (ואת HR) מבחוץ – סימפתטי/פרה-סימפתטי, קטכולאמינים, הורמוני תריס, אינסולין, גלוקגון, GH, O₂/CO₂.'},
{s:'extra',t:'sv',q:'מהי "בקרה תלוית קצב" (<i class="en">rate-induced regulation</i>, תופעת המדרגות) ומה המנגנון?',o:['ככל שהקצב עולה הכוח יורד בגלל עייפות','ככל שמעלים את קצב הלב גדל הכוח שהלב מפתח – יותר AP ליחידת זמן מכניסים יותר סידן לתא ופחות זמן להוציאו, וגם זרם הסידן בכל AP גדל → ↑סידן תוך-תאי','הקצב לא משפיע על הכוח','הכוח עולה בגלל פרנק-סטרלינג'],a:1,e:'זו בקרה מקומית הנובעת מצימוד עירור-כיווץ. בלב שלם היא מתחרה בקיצור זמן המילוי; במאמץ היא תורמת לשמירת SV בקצבים גבוהים.'},
{s:'extra',t:'sv',q:'אחרי פעימה חדרית מוקדמת (אקסטרה-סיסטולה) מגיעה הפסקה מפצה, והפעימה שאחריה מורגשת חזקה במיוחד. מדוע?',o:['בגלל גירוי סימפתטי פתאומי','זמן המילוי הארוך מגדיל את ה-EDV (פרנק-סטרלינג), ובנוסף הצטבר יותר סידן ב-SR – שניהם מגדילים את הכוח ואת SV של הפעימה הבאה','בגלל ירידה ב-afterload','בגלל רפלקס ביינברידג׳'],a:1,e:'הפעימה המוקדמת עצמה חלשה (EDV נמוך, סידן לא התמלא – A בגרף). הפעימה הבאה (B) חזקה מהרגיל (C) – שני מנגנוני הבקרה המקומית פועלים יחד.'},
{s:'extra',t:'sv',q:'כיצד הורמוני בלוטת התריס משפיעים על הלב, ומה התמונה בהיפרתירואידיזם?',o:['מורידים את מספר רצפטורי β → ברדיקרדיה','מעלים את מספר רצפטורי β ואת סינתזת המיוזין המהיר ו-SERCA → ↑HR, ↑כיווציות, ↑CO; בהיפרתירואידיזם: טכיקרדיה, לחץ דופק רחב, פרפור עליות, אי-ספיקה עם תפוקה גבוהה','משפיעים רק על חילוף החומרים ולא על הלב','גורמים לירידה בכיווציות'],a:1,e:'T3/T4 פועלים ישירות על התאים (גנים) ובעקיפין דרך הגברת הרגישות לקטכולאמינים. חוסמי β מקלים על התסמינים הלבביים. היפותירואידיזם – ההפך (ברדיקרדיה, CO נמוך).'},
{s:'extra',t:'sv',q:'מהו האפקט הדו-שלבי (ביפאזי) של חמצן על ביצועי הלב?',o:['היפוקסיה תמיד מדכאת את הלב','היפוקסיה קלה משפרת את ביצועי הלב (גירוי סימפתטי, הרחבת כלים כליליים); היפוקסיה קשה מדכאת אותו (חוסר ATP, חמצת)','היפוקסיה תמיד משפרת את הלב','חמצן גבוה משפר תמיד'],a:1,e:'מההרצאה: "היפוקסיה קלה משפרת ביצועי הלב, היפוקסיה קשה – מדכאת אותו". בהיפוקסיה קשה משאבות הסידן והמיוזין נשארות ללא ATP, מצטברים H⁺ ולקטט – ↓כיווציות והפרעות קצב.'},
{s:'extra',t:'sv',q:'כיצד חמצת (עלייה ב-PCO₂ וירידת pH) משפיעה על כיווציות הלב?',o:['מגבירה כיווציות דרך גירוי סימפתטי','מדכאת כיווציות ישירות: מפחיתה את כמות הסידן המשתחררת מה-SR ומפחיתה את קישור הסידן לטרופונין (H⁺ מתחרה עם Ca²⁺)','אין השפעה ישירה','מגבירה את רגישות הטרופונין לסידן'],a:1,e:'CO₂ + H₂O → H₂CO₃ → H⁺. ה-H⁺ פוגע בשחרור הסידן מה-SR ומתחרה עם הסידן על Troponin C – פחות גשרי אקטין-מיוזין לכל ריכוז סידן. בנוסף חמצת מרחיבה עורקיקים ומורידה את התגובה לקטכולאמינים.'},
{s:'extra',t:'sv',q:'במאמץ גופני עצים תפוקת הלב עולה מ-5 ל-20 ליטר/דקה. איזה שילוב של שינויים אחראי לכך?',o:['רק עלייה בקצב הלב','↑HR (סימפתטי, ↓ואגוס) + ↑SV (↑כיווציות סימפתטית, ↑החזר ורידי ע"י משאבת השרירים וכיווץ ורידים) + ↓TPR (הרחבת עורקיקים בשריר ע"י מטבוליטים)','רק עלייה ב-preload','↑TPR ו-↑afterload'],a:1,e:'כל רמות הבקרה פועלות יחד: הסימפתטי מעלה HR וכיווציות (וגורם להרפיה מהירה שמאפשרת מילוי בקצב גבוה), הבקרה המקומית בשריר מרחיבה את הכלים ומנתבת את הדם (השריר מקבל פי 20), המוח נשאר קבוע.'},
{s:'extra',t:'sv',q:'מתן חוסם β (פרופרנולול) לאדם בריא במנוחה יגרום ל:',o:['↑HR, ↑כיווציות','↓HR (מעט), ↓כיווציות, ↓CO; חסימת התגובה הסימפתטית למאמץ','↑TPR בלבד ללא השפעה על הלב','↑HR בגלל רפלקס'],a:1,e:'במנוחה הטונוס הסימפתטי נמוך ולכן ההשפעה על HR קטנה (~−15), אבל במאמץ העלייה ב-HR ובכיווציות נחסמת. כיווציות ↓ → ESPVR שטוח יותר, ESV ↑. שימושים: פרפור עליות (האטת AVN), יל"ד, אי-ספיקת לב כרונית, היפרתירואידיזם.'},
{s:'extra',t:'sv',q:'גלוקגון ואינסולין משפיעים על הלב. איזו אמירה נכונה?',o:['שניהם מדכאים את כיווציות הלב','שניהם בעלי אפקט אינוטרופי חיובי; גלוקגון מעלה cAMP דרך רצפטור משלו (ולכן משמש בהרעלת חוסמי β)','אינסולין מוריד את קצב הלב; גלוקגון מעלה','אין להם השפעה על הלב'],a:1,e:'מרשימת ההורמונים בהרצאה (אדרנל, תריס, אינסולין, גלוקגון, GH). גלוקגון "עוקף" את רצפטור ה-β ומעלה cAMP ישירות – אינוטרופי וכרונוטרופי חיובי.'},
{s:'extra',t:'sv',q:'כיצד ירידה בכמות הדם (דימום) משפיעה על עקומת פרנק-סטרלינג ועל התגובה הרפלקסיבית?',o:['↑preload → ↑SV; ברורצפטורים → ↓HR','↓החזר ורידי → ↓EDV (preload) → ↓SV ו-↓CO (ירידה על עקומת פרנק-סטרלינג) → ↓לחץ → ברורצפטורים → ↑סימפתטי: ↑HR, ↑כיווציות, כיווץ ורידים (גיוס דם) ועורקיקים (↑TPR)','ביינברידג׳ מפעיל ↑HR','ANP מופרש ומגביר שיתון'],a:1,e:'בנפח דם קטן הברורצפטורים דומיננטיים (לא ביינברידג׳). הכיווץ הוורידי מחזיר דם מהמאגר (67% מהדם) ומעלה preload; לטווח ארוך הכליה (RAAS, ADH) משחזרת את הנפח.'},
];
const sel=document.getElementById('topic');Object.entries(TOPICS).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;sel.appendChild(o);});
const srcSel=document.getElementById('src');
let order=Q.map((_,i)=>i), examMode=false;
const state={};
function esc(s){return s;}
function render(){
 const box=document.getElementById('quiz');box.innerHTML='';
 order.forEach((i,n)=>{const q=Q[i];const d=document.createElement('div');d.className='q';d.dataset.t=q.t;d.dataset.s=q.s;d.dataset.i=i;
  const srcLabel=q.s==='course'?('מהבחנים · '+q.src):'שאלה נוספת';
  let h='<div class="meta"><span class="src '+(q.s==='course'?'':'extra')+'">'+srcLabel+'</span><span>'+TOPICS[q.t]+'</span><span>#'+(n+1)+'</span></div>';
  h+='<h3>'+q.q+'</h3>';
  if(q.img)h+='<img src="'+q.img+'" alt="" onclick="lb(this)">';
  h+='<div class="opts">'+q.o.map((o,j)=>'<div class="opt" data-j="'+j+'">'+String.fromCharCode(1488+j)+'. '+o+'</div>').join('')+'</div>';
  h+='<div class="exp">'+q.e+'</div>';
  d.innerHTML=h;
  d.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',onPick));
  if(state[i]!==undefined)mark(d,state[i]);
  box.appendChild(d);});
 filter();updateScore();
}
function onPick(e){const d=e.currentTarget.closest('.q');if(d.classList.contains('done'))return;const i=+d.dataset.i;const j=+e.currentTarget.dataset.j;state[i]=j;mark(d,j);updateScore();}
function mark(d,j){const q=Q[+d.dataset.i];d.classList.add('done');d.querySelectorAll('.opt').forEach(o=>{const k=+o.dataset.j;if(k===q.a)o.classList.add('correct');else if(k===j)o.classList.add('wrong');});}
function visible(){return [...document.querySelectorAll('.q')].filter(d=>!d.classList.contains('hidden'));}
function updateScore(){const vis=visible();const done=vis.filter(d=>d.classList.contains('done'));const ok=done.filter(d=>state[+d.dataset.i]===Q[+d.dataset.i].a);
 document.getElementById('answered').textContent=done.length;document.getElementById('total').textContent=vis.length;document.getElementById('correct').textContent=ok.length;
 document.getElementById('bar').style.width=(vis.length?100*ok.length/vis.length:0)+'%';
 const f=document.getElementById('final');if(vis.length&&done.length===vis.length){f.style.display='block';const p=Math.round(100*ok.length/vis.length);f.innerHTML='<b>סיימת!</b> '+ok.length+' מתוך '+vis.length+' נכונות ('+p+'%). '+(p>=85?'מצוין – מוכן/ה לבוחן.':p>=70?'טוב. עברו שוב על ההסברים של השאלות השגויות.':'כדאי לחזור למדריך ולתרגל שוב.');}else f.style.display='none';}
function filter(){const t=sel.value,s=srcSel.value;document.querySelectorAll('.q').forEach(d=>{const hide=(t!=='all'&&d.dataset.t!==t)||(s!=='all'&&d.dataset.s!==s)||(examMode&&!examSet.has(+d.dataset.i));d.classList.toggle('hidden',hide);});updateScore();}
let examSet=new Set();
sel.addEventListener('change',()=>{examMode=false;filter();});
srcSel.addEventListener('change',()=>{examMode=false;filter();});
document.getElementById('shuffle').addEventListener('click',()=>{for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]];}render();});
document.getElementById('exam').addEventListener('click',()=>{for(const k in state)delete state[k];sel.value='all';srcSel.value='all';const idx=Q.map((_,i)=>i);for(let k=idx.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[idx[k],idx[r]]=[idx[r],idx[k]];}examSet=new Set(idx.slice(0,20));order=idx.slice(0,20).concat(idx.slice(20));examMode=true;render();window.scrollTo(0,0);});
document.getElementById('reset').addEventListener('click',()=>{for(const k in state)delete state[k];examMode=false;render();});
document.getElementById('showAll').addEventListener('click',()=>{document.querySelectorAll('.q').forEach(d=>{if(!d.classList.contains('done')){d.classList.add('done');d.querySelectorAll('.opt').forEach(o=>{if(+o.dataset.j===Q[+d.dataset.i].a)o.classList.add('correct');});}});});
function lb(img){document.getElementById('lbimg').src=img.src;document.getElementById('lb').style.display='flex';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lb').style.display='none';});
document.getElementById('count').textContent=Q.length+' שאלות · '+Q.filter(q=>q.s==='course').length+' מהבחנים · משוב מיידי';
render();
</script>
</body>
</html>
